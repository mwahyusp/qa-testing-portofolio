<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Commerce — Katalog Produk</title>
  <link rel="stylesheet" href="/app/styles/style.css" />
  <link rel="stylesheet" href="/app/styles/responsive.css" />
</head>
<body>
 <header class="site-header">
  <a href="/app/products.html" class="site-title-link">
    <h1 class="site-title">Mini E-Commerce</h1>
  </a>
  <nav class="site-nav">
    <a href="/app/cart.html" class="nav-cart">
      Cart (<span id="cart-count">0</span>)
    </a>
    <a href="/app/index.html">Logout</a>
  </nav>
</header>

  <main class="container">
    <h2 class="page-title">Katalog Produk</h2>

    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Cari produk..." />
      <span class="hint" id="search-hint"></span>
    </div>

    <p id="catalog-message" class="message" role="alert"></p>

    <section id="product-list" class="product-grid"></section>

    <p id="empty-state" class="empty-state" hidden>
      Tidak ada produk yang cocok dengan pencarian.
    </p>
  </main>

  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close-modal aria-label="Tutup">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/app/scripts/products.js"></script>
</body>
</html>
