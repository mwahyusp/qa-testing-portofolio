<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Commerce — Cart</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Mini E-Commerce</h1>
    <nav class="site-nav">
      <a href="products.html">← Lanjut Belanja</a>
    </nav>
  </header>

  <main class="container">
    <h2 class="page-title">Shopping Cart</h2>

    <p id="cart-message" class="message" role="alert"></p>

    <section id="cart-list" class="cart-list"></section>

    <p id="cart-empty" class="empty-state" hidden>
      Cart kamu masih kosong. <a href="products.html">Mulai belanja</a>.
    </p>

    <aside id="cart-summary" class="cart-summary" hidden>
      <div class="summary-row">
        <span>Total Item</span>
        <span id="summary-items">0</span>
      </div>
      <div class="summary-row summary-total">
        <span>Subtotal</span>
        <span id="summary-subtotal">Rp 0</span>
      </div>
      <button class="btn btn-primary" id="btn-checkout" disabled>
        Checkout (Fase 3)
      </button>
    </aside>
  </main>

  <script src="scripts/cart.js"></script>
</body>
</html>
