<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Commerce — Login</title>
  <link rel="stylesheet" href="/app/styles/style.css" />
  <link rel="stylesheet" href="/app/styles/responsive.css" />
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card">
      <h1 class="auth-title">Mini E-Commerce</h1>
      <p class="auth-subtitle">Silakan login untuk melanjutkan</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" placeholder="user@test.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••" />
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login">Login</button>

        <p id="login-message" class="message" role="alert" aria-live="polite"></p>
      </form>

      <div class="demo-hint" role="note">
        <p class="demo-hint-title">🔑 Demo Credentials</p>
        <ul class="demo-hint-list">
          <li><span>Email</span><code>user@test.com</code></li>
          <li><span>Password</span><code>123456</code></li>
        </ul>
        <button type="button" class="btn btn-hint" id="btn-autofill">
          Isi otomatis
        </button>
    </section>
  </main>

  <script src="/app/scripts/login.js"></script>
</body>
</html>
